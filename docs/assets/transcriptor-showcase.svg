<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Transcriptor, del audio al conocimiento</title>
  <desc id="description">Vista animada de la aplicación con reproductor, transcripción sincronizada, detección de hablantes y progreso local.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d0e"/>
      <stop offset="0.55" stop-color="#101718"/>
      <stop offset="1" stop-color="#0b1112"/>
    </linearGradient>
    <linearGradient id="limeGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7e92a"/>
      <stop offset="1" stop-color="#e2ff55"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#d8ff3e" stop-opacity=".22"/>
      <stop offset="1" stop-color="#d8ff3e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="appClip">
      <rect x="64" y="58" width="1072" height="444" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1200" height="560" fill="url(#background)"/>
  <circle cx="145" cy="80" r="240" fill="url(#halo)"/>
  <circle cx="1090" cy="500" r="260" fill="url(#halo)" opacity=".5"/>

  <g opacity=".12" fill="#d9ff42">
    <circle cx="42" cy="138" r="2"/><circle cx="1168" cy="112" r="2"/>
    <circle cx="90" cy="504" r="2"/><circle cx="1105" cy="70" r="2"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="58" width="1072" height="444" rx="22" fill="#0c1213" stroke="#2a3637" stroke-width="2"/>
    <g clip-path="url(#appClip)">
      <rect x="64" y="58" width="1072" height="62" fill="#12191a"/>
      <line x1="64" y1="120" x2="1136" y2="120" stroke="#263132"/>

      <rect x="84" y="75" width="28" height="28" rx="7" fill="#d8ff3e"/>
      <path d="M91 83h14v12H91zm2 3h10" fill="none" stroke="#172000" stroke-width="2" stroke-linejoin="round"/>
      <text x="124" y="93" fill="#f3f7f7" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Transcriptor</text>
      <text x="124" y="108" fill="#8ea1a3" font-family="Segoe UI, Arial, sans-serif" font-size="9">IA LOCAL · PRIVADA</text>

      <rect x="858" y="74" width="104" height="31" rx="9" fill="#192223" stroke="#354344"/>
      <text x="880" y="94" fill="#dce4e5" font-family="Segoe UI, Arial, sans-serif" font-size="12">Analizar</text>
      <rect x="973" y="74" width="139" height="31" rx="9" fill="url(#limeGlow)"/>
      <text x="994" y="94" fill="#182000" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Transcribir</text>

      <rect x="84" y="140" width="596" height="282" rx="16" fill="#080c0d" stroke="#273133"/>
      <text x="104" y="165" fill="#d8ff3e" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">AUDIO</text>
      <text x="151" y="165" fill="#edf2f2" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Conversación de ejemplo.wav</text>

      <circle cx="382" cy="264" r="91" fill="none" stroke="#344019" stroke-width="2"/>
      <circle cx="382" cy="264" r="67" fill="none" stroke="#46551c" stroke-width="2"/>
      <circle cx="382" cy="264" r="44" fill="none" stroke="#637527" stroke-width="2"/>
      <circle cx="382" cy="264" r="21" fill="#d8ff3e" opacity=".14"/>
      <path d="M374 251l24 13-24 14z" fill="#d8ff3e"/>

      <g fill="#d8ff3e">
        <rect x="185" y="371" width="4" height="12" rx="2">
          <animate attributeName="height" values="12;28;12" dur="1.1s" repeatCount="indefinite"/>
          <animate attributeName="y" values="371;363;371" dur="1.1s" repeatCount="indefinite"/>
        </rect>
        <rect x="194" y="367" width="4" height="20" rx="2">
          <animate attributeName="height" values="20;8;20" dur=".9s" repeatCount="indefinite"/>
          <animate attributeName="y" values="367;373;367" dur=".9s" repeatCount="indefinite"/>
        </rect>
        <rect x="203" y="362" width="4" height="30" rx="2">
          <animate attributeName="height" values="30;16;30" dur="1.3s" repeatCount="indefinite"/>
          <animate attributeName="y" values="362;369;362" dur="1.3s" repeatCount="indefinite"/>
        </rect>
        <rect x="212" y="368" width="4" height="18" rx="2">
          <animate attributeName="height" values="18;34;18" dur="1s" repeatCount="indefinite"/>
          <animate attributeName="y" values="368;360;368" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
      <rect x="228" y="375" width="412" height="4" rx="2" fill="#2e393a"/>
      <rect x="228" y="375" width="185" height="4" rx="2" fill="url(#limeGlow)">
        <animate attributeName="width" values="70;185;310;70" dur="6s" repeatCount="indefinite"/>
      </rect>
      <circle cy="377" r="7" fill="#d8ff3e">
        <animate attributeName="cx" values="298;413;538;298" dur="6s" repeatCount="indefinite"/>
      </circle>
      <text x="104" y="408" fill="#91a3a5" font-family="Segoe UI, Arial, sans-serif" font-size="10">00:42</text>
      <text x="626" y="408" fill="#91a3a5" font-family="Segoe UI, Arial, sans-serif" font-size="10">12:08</text>

      <rect x="698" y="140" width="418" height="282" rx="16" fill="#12191a" stroke="#2a3637"/>
      <text x="720" y="165" fill="#d8ff3e" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">TRANSCRIPCIÓN SINCRONIZADA</text>
      <rect x="720" y="179" width="374" height="38" rx="10" fill="#182122"/>
      <circle cx="739" cy="198" r="6" fill="none" stroke="#7f9294" stroke-width="2"/>
      <path d="M744 203l6 6" stroke="#7f9294" stroke-width="2"/>
      <text x="758" y="202" fill="#76898b" font-family="Segoe UI, Arial, sans-serif" font-size="11">Buscar en la transcripción…</text>

      <g>
        <rect x="720" y="229" width="374" height="51" rx="10" fill="#172021"/>
        <rect x="720" y="229" width="3" height="51" rx="2" fill="#d8ff3e"/>
        <text x="737" y="247" fill="#d8ff3e" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700">00:39 · NOEL</text>
        <text x="737" y="266" fill="#eef3f3" font-family="Segoe UI, Arial, sans-serif" font-size="12">La idea principal empieza justo aquí…</text>
        <animate attributeName="opacity" values="1;.58;.58;1" keyTimes="0;.35;.75;1" dur="6s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="720" y="288" width="374" height="51" rx="10" fill="#101718"/>
        <text x="737" y="306" fill="#a9bbbd" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700">00:45 · ISABEL</text>
        <text x="737" y="325" fill="#d8e0e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">…y la aplicación mantiene todo el contexto.</text>
        <animate attributeName="opacity" values=".58;1;.58;.58" keyTimes="0;.35;.75;1" dur="6s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="720" y="347" width="374" height="51" rx="10" fill="#101718"/>
        <text x="737" y="365" fill="#a9bbbd" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700">00:52 · NOEL</text>
        <text x="737" y="384" fill="#d8e0e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Después puedes editar, analizar y exportar.</text>
        <animate attributeName="opacity" values=".58;.58;1;.58" keyTimes="0;.35;.75;1" dur="6s" repeatCount="indefinite"/>
      </g>

      <rect x="64" y="438" width="1072" height="64" fill="#11191a"/>
      <circle cx="91" cy="467" r="15" fill="#d8ff3e" opacity=".14"/>
      <path d="M82 468h5l4-9 5 17 4-8h7" fill="none" stroke="#d8ff3e" stroke-width="2"/>
      <text x="117" y="460" fill="#eef3f3" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Procesando localmente</text>
      <text x="117" y="477" fill="#8fa1a3" font-family="Segoe UI, Arial, sans-serif" font-size="9">Voces · contexto · revisión · guardado</text>
      <rect x="360" y="459" width="500" height="7" rx="3.5" fill="#2a3536"/>
      <rect x="360" y="459" height="7" rx="3.5" fill="url(#limeGlow)">
        <animate attributeName="width" values="35;180;335;500;35" dur="7s" repeatCount="indefinite"/>
      </rect>
      <g transform="translate(891 451)">
        <circle cx="10" cy="10" r="8" fill="none" stroke="#d8ff3e" stroke-width="2"/>
        <path d="M6 10l3 3 6-7" fill="none" stroke="#d8ff3e" stroke-width="2"/>
        <text x="26" y="14" fill="#d8ff3e" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">100 % privado</text>
      </g>
    </g>
  </g>

  <circle cx="1015" cy="96" r="13" fill="#d8ff3e" opacity=".24" filter="url(#softGlow)">
    <animate attributeName="opacity" values=".15;.55;.15" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
