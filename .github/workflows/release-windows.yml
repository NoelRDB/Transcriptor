            throw "checksums-SHA256.txt debe cubrir exactamente NSIS, MSI, avisos y corresponding source."
          }
          for ($Index = 0; $Index -lt $HashedAssets.Count; $Index++) {
            $Asset = $HashedAssets[$Index]
            $Hash = (
              Get-FileHash -LiteralPath $Asset.FullName -Algorithm SHA256
