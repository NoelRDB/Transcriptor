            }
          }

          $AssetPaths = @($ReleaseAssets | Select-Object -ExpandProperty FullName)
          & gh release upload $env:VALIDATED_TAG @AssetPaths --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "No se pudieron sustituir los assets sin firmar del borrador."
          }

          $UpdatedRaw = gh api `
            "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:VALIDATED_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo cotejar el borrador después de la subida."
          }
          $Updated = $UpdatedRaw | ConvertFrom-Json
          $RemoteAssets = @($Updated.assets)
          if (
            [string]$Updated.id -cne $env:EXPECTED_RELEASE_ID -or
            -not $Updated.draft -or
            $RemoteAssets.Count -ne 5
          ) {
            throw "El borrador no conserva los cinco assets firmados."
          }
          foreach ($LocalAsset in $ReleaseAssets) {
            $RemoteAsset = @(
              $RemoteAssets | Where-Object { $_.name -ceq $LocalAsset.Name }
            )
            if ($RemoteAsset.Count -ne 1) {
              throw "Asset remoto ausente o duplicado: $($LocalAsset.Name)"
            }
            $LocalHash = (
              Get-FileHash -LiteralPath $LocalAsset.FullName -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            if (
              [string]$RemoteAsset[0].state -cne "uploaded" -or
              [long]$RemoteAsset[0].size -ne [long]$LocalAsset.Length -or
              [string]$RemoteAsset[0].digest -cne "sha256:$LocalHash"
            ) {
              throw "El asset remoto no coincide con el validado: $($LocalAsset.Name)"
            }
          }

      - name: Atestar la procedencia de los cinco assets finales firmados
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            release/*-setup.exe
            release/*.msi
            release/checksums-SHA256.txt
            release/THIRD_PARTY_NOTICES.md
            release/Transcriptor-*-FFmpeg-corresponding-source.tar.gz

      - name: Publicar únicamente la versión firmada
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_TAG: ${{ steps.release-metadata.outputs.tag_name }}
          SOURCE_SHA: ${{ steps.release-metadata.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ steps.release-metadata.outputs.tag_object_sha }}
          EXPECTED_RELEASE_ID: ${{ steps.draft-metadata.outputs.release_id }}
          EXPECTED_BODY_SHA256: ${{ steps.draft-metadata.outputs.body_sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          if (
            $env:VALIDATED_TAG -ceq "v0.1.1" -or
            $env:VALIDATED_TAG -notmatch "^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$" -or
            $env:SOURCE_SHA -notmatch "^[0-9a-f]{40}$" -or
            $env:TAG_OBJECT_SHA -notmatch "^[0-9a-f]{40}$" -or
            $env:EXPECTED_RELEASE_ID -notmatch "^\d+$" -or
            $env:EXPECTED_BODY_SHA256 -notmatch "^[0-9a-f]{64}$"
          ) {
            throw "La puerta final recibió metadatos de firma no autorizados."
          }

          ./scripts/verify-release.ps1 `
            -RequireRuntimeAssets `
            -RequireInstallers `
            -RequireInstallerPayloadInspection `
            -InstallerDirectory ".\release\signed" `
            -RequireAuthenticode `
            -ExpectedPublisher "SignPath Foundation"

          $TagRef = "refs/tags/$env:VALIDATED_TAG"
          git fetch --no-tags origin `
            "+refs/heads/master:refs/remotes/origin/master"
          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo consultar master en la puerta final."
          }
          git fetch --force origin "+${TagRef}:${TagRef}"
          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo consultar el tag en la puerta final."
          }
          $CurrentMaster = (git rev-parse "refs/remotes/origin/master").Trim()
          $CurrentTagObject = (git rev-parse $TagRef).Trim()
          $CurrentTagType = (git cat-file -t $CurrentTagObject).Trim()
          $CurrentTaggedCommit = (git rev-parse "${TagRef}^{commit}").Trim()
          if (
            $LASTEXITCODE -ne 0 -or
            $CurrentMaster -cne $env:SOURCE_SHA -or
            $CurrentTagObject -cne $env:TAG_OBJECT_SHA -or
            $CurrentTagType -cne "tag" -or
            $CurrentTaggedCommit -cne $env:SOURCE_SHA
          ) {
            throw "El tag ya no es el anotado que apunta al HEAD actual de master."
          }

          $ReleaseRaw = gh api `
            "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:VALIDATED_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo recuperar el borrador en la puerta final."
          }
          $Release = $ReleaseRaw | ConvertFrom-Json
          $BodyBytes = [System.Text.Encoding]::UTF8.GetBytes([string]$Release.body)
          $BodyHasher = [System.Security.Cryptography.SHA256]::Create()
          try {
            $BodySha256 = [System.BitConverter]::ToString(
              $BodyHasher.ComputeHash($BodyBytes)
            ).Replace("-", "").ToLowerInvariant()
          }
          finally {
            $BodyHasher.Dispose()
          }
          if (
            [string]$Release.id -cne $env:EXPECTED_RELEASE_ID -or
            -not $Release.draft -or
            $Release.prerelease -or
            $Release.tag_name -cne $env:VALIDATED_TAG -or
            $BodySha256 -cne $env:EXPECTED_BODY_SHA256
          ) {
            throw "El borrador cambió de identidad, estado o descripción."
          }

          $LocalAssets = @(Get-ChildItem -LiteralPath ".\release" -File)
          $RemoteAssets = @($Release.assets)
          if ($LocalAssets.Count -ne 5 -or $RemoteAssets.Count -ne 5) {
            throw "La puerta final exige exactamente cinco assets."
          }
          foreach ($LocalAsset in $LocalAssets) {
            $RemoteAsset = @(
              $RemoteAssets | Where-Object { $_.name -ceq $LocalAsset.Name }
            )
            if ($RemoteAsset.Count -ne 1) {
              throw "Asset inesperado en la puerta final: $($LocalAsset.Name)"
            }
            $LocalHash = (
              Get-FileHash -LiteralPath $LocalAsset.FullName -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            if (
              [string]$RemoteAsset[0].state -cne "uploaded" -or
              [long]$RemoteAsset[0].size -ne [long]$LocalAsset.Length -or
              [string]$RemoteAsset[0].digest -cne "sha256:$LocalHash"
            ) {
              throw "El asset remoto cambió antes de publicar: $($LocalAsset.Name)"
            }
          }

          $PublishedRaw = gh api `
            --method PATCH `
            "repos/$env:GITHUB_REPOSITORY/releases/$env:EXPECTED_RELEASE_ID" `
            -F "draft=false" `
            -F "prerelease=false" `
            -f "make_latest=true"
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub no pudo publicar la release firmada."
          }
          $Published = $PublishedRaw | ConvertFrom-Json
          $PublishedBodyBytes = [System.Text.Encoding]::UTF8.GetBytes(
            [string]$Published.body
          )
          $PublishedBodyHasher = [System.Security.Cryptography.SHA256]::Create()
          try {
            $PublishedBodySha256 = [System.BitConverter]::ToString(
              $PublishedBodyHasher.ComputeHash($PublishedBodyBytes)
            ).Replace("-", "").ToLowerInvariant()
          }
          finally {
            $PublishedBodyHasher.Dispose()
          }
          if (
            [string]$Published.id -cne $env:EXPECTED_RELEASE_ID -or
            $Published.draft -or
            $Published.prerelease -or
            $Published.tag_name -cne $env:VALIDATED_TAG -or
            @($Published.assets).Count -ne 5 -or
            $PublishedBodySha256 -cne $env:EXPECTED_BODY_SHA256
          ) {
            throw "La respuesta pública no coincide con la Release firmada validada."
          }

          @(
            "### Release firmada publicada",
            "",
            "- Tag anotado: ``$env:VALIDATED_TAG``",
            "- Commit y HEAD de master: ``$env:SOURCE_SHA``",
            "- Editor verificado: ``SignPath Foundation``",
            "- Assets: NSIS, MSI, checksums, avisos y corresponding source"
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Confirmar cierre seguro si una etapa falla
        if: ${{ failure() }}
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_TAG: ${{ steps.release-metadata.outputs.tag_name }}
        run: |
          if (
            $env:VALIDATED_TAG -ceq "v0.1.1" -or
            $env:VALIDATED_TAG -notmatch "^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$"
          ) {
            Write-Host "El flujo falló antes de validar un tag de firma."
            exit 0
          }

          $ReleaseRaw = gh api `
            "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:VALIDATED_TAG" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No existe una Release para el tag validado."
            exit 0
          }
          $Release = $ReleaseRaw | ConvertFrom-Json
          if ($Release.draft) {
            Write-Host "Fallo cerrado: la Release firmada permanece como borrador privado."
            exit 0
          }
          Write-Error "La Release aparece pública pese al fallo; revísala inmediatamente."
